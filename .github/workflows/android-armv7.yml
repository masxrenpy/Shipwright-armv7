name: Build armv7 (32-bit) APK

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Allow git in container
        run: git config --global --add safe.directory '*'

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > Android/local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> Android/local.properties

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y ccache $(cat .github/workflows/apt-deps.txt)

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-armv7-${{ github.run_id }}
          restore-keys: ccache-armv7-

      - name: Generate soh.o2r
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target GenerateSohOtr --parallel
          cp soh/soh.o2r Android/app/src/main/assets/soh.o2r

      - name: Switch to 32-bit (armeabi-v7a)
        run: |
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters 'armeabi-v7a'/g" Android/app/build.gradle
          sed -i 's/"-DBUILD_REMOTE_CONTROL=1"/"-DBUILD_REMOTE_CONTROL=1", "-DANDROID_ARM_NEON=TRUE", "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"/g' Android/app/build.gradle
          sed -i 's/storeFile file(storeFile)/storeFile file(project.storeFile)/' Android/app/build.gradle
          grep -n "abiFilters\|ANDROID_ARM_NEON\|storeFile" Android/app/build.gradle

      - name: Fix NEON audio mixer for 32-bit ARM
        run: |
          sed -i '/^#include <arm_neon.h>$/a #if !defined(__aarch64__)\n#define vmull_high_n_s16(a, b) vmull_n_s16(vget_high_s16(a), (b))\n#define vmull_high_s16(a, b) vmull_s16(vget_high_s16(a), vget_high_s16(b))\n#endif' soh/soh/mixer.c
          grep -n -A4 "arm_neon.h" soh/soh/mixer.c

      - name: Diagnostic v2 - log extraction checkpoints (Android)
        run: |
          python3 - <<'PY'
          p = 'soh/soh/Extractor/Extract.cpp'
          s = open(p).read()
          def rep(old, new):
              global s
              assert s.count(old) == 1, 'anchor not found once: ' + old
              s = s.replace(old, new)
          rep('#include "variables.h"\n', '''#include "variables.h"
          #include <cstdio>
          #include <filesystem>
          #include <string>
          #ifdef __ANDROID__
          #include <fcntl.h>
          #include <unistd.h>
          static void DiagLog(const std::string& msg) {
              std::error_code ec;
              std::filesystem::create_directories("/storage/emulated/0/SOH/logs", ec);
              FILE* f = fopen("/storage/emulated/0/SOH/logs/extract-diag.txt", "a");
              if (f) {
                  fprintf(f, "%s\\n", msg.c_str());
                  fclose(f);
              }
          }
          #else
          static void DiagLog(const std::string&) {}
          #endif
          ''')
          rep('    javaRomPath = strdup(filePathStr);\n',
              '    javaRomPath = strdup(filePathStr);\n    DiagLog(std::string("[0] picker returned: ") + filePathStr);\n')
          rep('    constexpr int argc = 22;\n',
              '    DiagLog("[1] CallZapd entered");\n    try {\n    constexpr int argc = 22;\n')
          rep('    exportdir = std::filesystem::absolute(exportdir).string();\n',
              '    exportdir = std::filesystem::absolute(exportdir).string();\n    DiagLog("[2] rom=" + romPath + " install=" + installPath + " export=" + exportdir);\n')
          rep('    std::string tempdir = Mkdtemp();\n',
              '    std::string tempdir = Mkdtemp();\n    DiagLog("[3] tempdir=" + tempdir);\n')
          rep('    std::filesystem::current_path(tempdir);\n',
              '    DiagLog("[4] assets copied");\n    std::filesystem::current_path(tempdir);\n')
          rep('    zapd_report(argc, (char**)argv.data(), extractCount, totalExtract);\n',
              '''#ifdef __ANDROID__
              {
                  int zfd = open("/storage/emulated/0/SOH/logs/zapd.txt", O_WRONLY | O_CREAT | O_TRUNC, 0644);
                  if (zfd >= 0) {
                      dup2(zfd, 1);
                      dup2(zfd, 2);
                      setvbuf(stdout, nullptr, _IONBF, 0);
                      setvbuf(stderr, nullptr, _IONBF, 0);
                  }
              }
          #endif
              DiagLog("[5] calling zapd_report");
              zapd_report(argc, (char**)argv.data(), extractCount, totalExtract);
              DiagLog("[6] zapd_report returned");
          ''')
          rep('    std::filesystem::copy(otrFile, exportdir',
              '    DiagLog("[7] copying o2r to export dir");\n    std::filesystem::copy(otrFile, exportdir')
          rep('    return false;\n}\n\nstatic void MessageboxWorker() {',
              '''    DiagLog("[8] CallZapd done");
              return false;
              } catch (const std::exception& e) {
                  DiagLog(std::string("EXCEPTION: ") + e.what());
                  throw;
              } catch (...) {
                  DiagLog("UNKNOWN EXCEPTION");
                  throw;
              }
          }

          static void MessageboxWorker() {''')
          open(p, 'w').write(s)
          PY
          grep -n "DiagLog(" soh/soh/Extractor/Extract.cpp | head -30

      - name: Apply patches (if any)
        run: |
          shopt -s nullglob
          for p in patches/main/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done
          for sub in libultraship ZAPDTR OTRExporter; do
            for p in patches/$sub/*.patch; do
              echo "Applying $p to $sub"
              (cd "$sub" && git apply --verbose "../$p")
            done
          done

      - name: Restore signing key from cache
        uses: actions/cache@v4
        with:
          path: Android/app/release.jks
          key: armv7-signing-key-v1

      - name: Create signing key if missing
        run: |
          if [ ! -f Android/app/release.jks ]; then
            keytool -genkeypair -keystore Android/app/release.jks -storetype PKCS12 \
              -storepass sohandroid -keypass sohandroid -alias soh \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SOH personal build"
          fi

      - name: Build release APK
        env:
          GIT_TAG: armv7-run${{ github.run_number }}
        run: |
          cd Android
          ./gradlew --no-daemon assembleRelease \
            -PstoreFile=release.jks -PstorePassword=sohandroid \
            -PkeyAlias=soh -PkeyPassword=sohandroid 2>&1 | tee ../build.log

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-armv7-${{ github.run_id }}

      - name: Summarize errors
        if: failure()
        run: |
          echo "===== FAILED targets ====="
          grep -n "FAILED:" build.log | cut -c1-300 | head -20 || true
          echo "===== First errors ====="
          grep -n -m 30 -E "error:|fatal error|undefined reference" build.log | cut -c1-400 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soh-armv7-apk
          path: Android/app/build/outputs/apk/release/*.apk
