name: Build armv7 (32-bit) APK

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Allow git in container
        run: git config --global --add safe.directory '*'

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > Android/local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> Android/local.properties

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y ccache $(cat .github/workflows/apt-deps.txt)

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-armv7-${{ github.run_id }}
          restore-keys: ccache-armv7-

      - name: Generate soh.o2r
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target GenerateSohOtr --parallel
          cp soh/soh.o2r Android/app/src/main/assets/soh.o2r

      - name: Switch to 32-bit (armeabi-v7a)
        run: |
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters 'armeabi-v7a'/g" Android/app/build.gradle
          sed -i 's/"-DBUILD_REMOTE_CONTROL=1"/"-DBUILD_REMOTE_CONTROL=1", "-DANDROID_ARM_NEON=TRUE", "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"/g' Android/app/build.gradle
          sed -i 's/storeFile file(storeFile)/storeFile file(project.storeFile)/' Android/app/build.gradle
          grep -n "abiFilters\|ANDROID_ARM_NEON\|storeFile" Android/app/build.gradle

      - name: Fix NEON audio mixer for 32-bit ARM
        run: |
          sed -i '/^#include <arm_neon.h>$/a #if !defined(__aarch64__)\n#define vmull_high_n_s16(a, b) vmull_n_s16(vget_high_s16(a), (b))\n#define vmull_high_s16(a, b) vmull_s16(vget_high_s16(a), vget_high_s16(b))\n#endif' soh/soh/mixer.c
          grep -n -A4 "arm_neon.h" soh/soh/mixer.c

      - name: Diagnostic v2 - log extraction checkpoints (Android)
        run: |
          python3 - <<'PY'
          p = 'soh/soh/Extractor/Extract.cpp'
          s = open(p).read()
          def rep(old, new):
              global s
              assert s.count(old) == 1, 'anchor not found once: ' + old
              s = s.replace(old, new)
          rep('#include "variables.h"\n', '''#include "variables.h"
          #include <cstdio>
          #include <filesystem>
          #include <string>
          #ifdef __ANDROID__
          #include <fcntl.h>
          #include <unistd.h>
          static void DiagLog(const std::string& msg) {
              std::error_code ec;
              std::filesystem::create_directories("/storage/emulated/0/SOH/logs", ec);
              FILE* f = fopen("/storage/emulated/0/SOH/logs/extract-diag.txt", "a");
              if (f) {
                  fprintf(f, "%s\\n", msg.c_str());
                  fclose(f);
              }
          }
          #else
          static void DiagLog(const std::string&) {}
          #endif
          ''')
          rep('    javaRomPath = strdup(filePathStr);\n',
              '    javaRomPath = strdup(filePathStr);\n    DiagLog(std::string("[0] picker returned: ") + filePathStr);\n')
          rep('    constexpr int argc = 22;\n',
              '    DiagLog("[1] CallZapd entered");\n    try {\n    constexpr int argc = 22;\n')
          rep('    exportdir = std::filesystem::absolute(exportdir).string();\n',
              '    exportdir = std::filesystem::absolute(exportdir).string();\n    DiagLog("[2] rom=" + romPath + " install=" + installPath + " export=" + exportdir);\n')
          rep('    std::string tempdir = Mkdtemp();\n',
              '    std::string tempdir = Mkdtemp();\n    DiagLog("[3] tempdir=" + tempdir);\n')
          rep('    std::filesystem::current_path(tempdir);\n',
              '    DiagLog("[4] assets copied");\n    std::filesystem::current_path(tempdir);\n')
          rep('    zapd_report(argc, (char**)argv.data(), extractCount, totalExtract);\n',
              '''#ifdef __ANDROID__
              {
                  int zfd = open("/storage/emulated/0/SOH/logs/zapd.txt", O_WRONLY | O_CREAT | O_TRUNC, 0644);
                  if (zfd >= 0) {
                      dup2(zfd, 1);
                      dup2(zfd, 2);
                      setvbuf(stdout, nullptr, _IONBF, 0);
                      setvbuf(stderr, nullptr, _IONBF, 0);
                  }
              }
          #endif
              DiagLog("[5] calling zapd_report");
              zapd_report(argc, (char**)argv.data(), extractCount, totalExtract);
              DiagLog("[6] zapd_report returned");
          ''')
          rep('    std::filesystem::copy(otrFile, exportdir',
              '    DiagLog("[7] copying o2r to export dir");\n    std::filesystem::copy(otrFile, exportdir')
          rep('    return false;\n}\n\nstatic void MessageboxWorker() {',
              '''    DiagLog("[8] CallZapd done");
              return false;
              } catch (const std::exception& e) {
                  DiagLog(std::string("EXCEPTION: ") + e.what());
                  throw;
              } catch (...) {
                  DiagLog("UNKNOWN EXCEPTION");
                  throw;
              }
          }

          static void MessageboxWorker() {''')
          open(p, 'w').write(s)
          PY
          grep -n "DiagLog(" soh/soh/Extractor/Extract.cpp | head -30

      - name: Diagnostic - file picker fix and logging (Java)
        run: |
          python3 - <<'PY'
          p = 'Android/app/src/main/java/com/dishii/soh/MainActivity.java'
          s = open(p).read()
          def rep(old, new):
              global s
              assert s.count(old) == 1, 'anchor not found once: ' + old
              s = s.replace(old, new)
          rep('        if (requestCode == FILE_PICKER_REQUEST_CODE && resultCode == RESULT_OK && data != null) {\n',
              '''        if (requestCode == FILE_PICKER_REQUEST_CODE && (resultCode != RESULT_OK || data == null)) {
                      diag("picker returned without a file: resultCode=" + resultCode + " data=" + data);
                      final int rc = resultCode;
                      runOnUiThread(() -> Toast.makeText(this, "File picker returned no file (resultCode=" + rc + ")", Toast.LENGTH_LONG).show());
                      nativeHandleSelectedFile(null);
                  } else if (requestCode == FILE_PICKER_REQUEST_CODE) {
          ''')
          rep('            Uri selectedFileUri = data.getData();\n',
              '            Uri selectedFileUri = data.getData();\n            diag("picker OK, uri=" + selectedFileUri);\n')
          rep('                } catch (IOException e) {\n                    e.printStackTrace();\n',
              '''                } catch (Exception e) {
                              e.printStackTrace();
                              diag("copy failed: " + e);
                              final String em = String.valueOf(e);
                              runOnUiThread(() -> Toast.makeText(this, "Copy failed: " + em, Toast.LENGTH_LONG).show());
          ''')
          rep('    public void showAlertDialog(',
              '''    private void diag(String msg) {
                  try {
                      File d = new File(Environment.getExternalStorageDirectory(), "SOH/logs");
                      d.mkdirs();
                      try (java.io.FileWriter w = new java.io.FileWriter(new File(d, "java-diag.txt"), true)) {
                          w.write(msg + "\\n");
                      }
                  } catch (Exception ignored) {
                  }
              }

              public void showAlertDialog(''')
          rep('        intent.setType("*/*");\n',
              '        intent.setType("*/*");\n        intent.addCategory(Intent.CATEGORY_OPENABLE);\n        diag("openFilePicker called");\n')
          open(p, 'w').write(s)
          PY
          sed -n '/protected void onActivityResult/,/STORAGE_PERMISSION_REQUEST_CODE) {/p' Android/app/src/main/java/com/dishii/soh/MainActivity.java | head -60

      - name: Enable ROM auto-detection in the SOH folder (Android)
        run: |
          python3 - <<'PY'
          import re
          p = 'soh/soh/OTRGlobals.cpp'
          s = open(p).read()
          s, n1 = re.subn(r'#ifdef __ANDROID__\s*// On Android, skip auto-discovery and use file picker instead\s*promptStep = PS_FIRST;\s*continue;\s*#endif', '', s, count=1)
          s, n2 = re.subn(r'(extract\.SetSearchPath\(dataPath\);\s*extract\.GetRoms\(args\);)', r'\1\n                        std::sort(args.begin(), args.end());\n                        args.erase(std::unique(args.begin(), args.end()), args.end());', s, count=1)
          assert n1 == 1 and n2 == 1, (n1, n2)
          open(p, 'w').write(s)
          PY
          sed -n '/case PS_LOCAL: {/,/case PS_FIRST: {/p' soh/soh/OTRGlobals.cpp

      - name: Renderer fix - high precision fragment shaders and GPU info log
        run: |
          python3 - <<'PY'
          import re
          p = 'libultraship/src/fast/backends/gfx_opengl.cpp'
          s = open(p).read()
          assert s.count('precision mediump float;') == 1
          s = s.replace('precision mediump float;', 'precision highp float;')
          diag = r"""glDepthFunc(GL_LEQUAL);
              glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);
          #ifdef USE_OPENGLES
              {
                  GLint mr[2] = { 0, 0 }, mp = 0, hr[2] = { 0, 0 }, hp = 0;
                  glGetShaderPrecisionFormat(GL_FRAGMENT_SHADER, GL_MEDIUM_FLOAT, mr, &mp);
                  glGetShaderPrecisionFormat(GL_FRAGMENT_SHADER, GL_HIGH_FLOAT, hr, &hp);
                  SPDLOG_INFO("[diag] GL vendor={} renderer={} version={}", (const char*)glGetString(GL_VENDOR),
                              (const char*)glGetString(GL_RENDERER), (const char*)glGetString(GL_VERSION));
                  SPDLOG_INFO("[diag] fragment precision bits: mediump={} highp={}", mp, hp);
              }
          #endif"""
          s, n = re.subn(r'glDepthFunc\(GL_LEQUAL\);\s*glBlendFunc\(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA\);', lambda m: diag, s, count=1)
          assert n == 1, n
          open(p, 'w').write(s)
          PY
          grep -n "precision highp\|\[diag\]" libultraship/src/fast/backends/gfx_opengl.cpp

      - name: Graphics diagnostics - switchable by folders in SOH (Android)
        run: |
          python3 - <<'PY'
          import re
          p = 'libultraship/src/fast/backends/gfx_opengl.cpp'
          s = open(p).read()
          def sub(pattern, repl, label):
              global s
              s, n = re.subn(pattern, lambda m: repl(m), s, count=1)
              assert n == 1, 'anchor failed: ' + label
          helper = '''
          static bool DiagFlag(const char* name) {
          #ifdef __ANDROID__
              std::error_code ec;
              bool on = std::filesystem::exists(std::string("/storage/emulated/0/SOH/diag_") + name, ec);
              if (on) {
                  SPDLOG_ERROR("[diag] flag on: {}", name);
              }
              return on;
          #else
              return false;
          #endif
          }
          '''
          sub(r'#include "ship/config/ConsoleVariable.h"\n', lambda m: m.group(0) + '#include <filesystem>\n#include <string>\n#include <system_error>\n' + helper, 'include')
          sub(r'(\{ "GLSL_VERSION", "#version 300 es" \},\s*\{ "attr", "in" \},\s*\{ "out", "out" \},\s*\{ "opengles", )true( \})', lambda m: m.group(1) + '!DiagFlag("noz")' + m.group(2), 'vertex opengles flag')
          sub(r'glPolygonOffset\(SSDB, -2\);\s*glEnable\(GL_POLYGON_OFFSET_FILL\);', lambda m: 'static const bool kNoPoly = DiagFlag("nopoly");\n            if (!kNoPoly) {\n                glPolygonOffset(SSDB, -2);\n                glEnable(GL_POLYGON_OFFSET_FILL);\n            }', 'polygon offset')
          sub(r'if \(mCurrentDepthTest \|\| mLastDepthMask\) \{\s*glEnable\(GL_DEPTH_TEST\);\s*glDepthMask\(mLastDepthMask \? GL_TRUE : GL_FALSE\);\s*glDepthFunc\(mCurrentDepthTest \? \(mCurrentZmodeDecal \? GL_LEQUAL : GL_LESS\) : GL_ALWAYS\);', lambda m: '''static const bool kNoDepth = DiagFlag("nodepth");
                  static const bool kDepthAlways = DiagFlag("depthalways");
                  if ((mCurrentDepthTest || mLastDepthMask) && !kNoDepth) {
                      glEnable(GL_DEPTH_TEST);
                      glDepthMask(mLastDepthMask ? GL_TRUE : GL_FALSE);
                      glDepthFunc(kDepthAlways ? GL_ALWAYS : (mCurrentDepthTest ? (mCurrentZmodeDecal ? GL_LEQUAL : GL_LESS) : GL_ALWAYS));''', 'depth')
          magenta = '''
              if (DiagFlag("magenta")) {
                  const std::string from = "discard;";
                  const std::string to = "{ vOutColor = vec4(1.0, 0.0, 1.0, 1.0); return; }";
                  size_t pos = 0;
                  while ((pos = result.find(from, pos)) != std::string::npos) {
                      result.replace(pos, from.size(), to);
                      pos += to.size();
                  }
              }'''
          sub(r'(processor\.bind_include_loader\(opengl_include_fs\);\s*auto result = processor\.process\(\);)(\s*// SPDLOG_INFO\("=========== FRAGMENT SHADER)', lambda m: m.group(1) + magenta + m.group(2), 'fragment shader')
          s = s.replace('SPDLOG_INFO("[diag]', 'SPDLOG_ERROR("[diag]')
          open(p, 'w').write(s)
          PY
          grep -n "DiagFlag" libultraship/src/fast/backends/gfx_opengl.cpp

      - name: Texture diagnostics - log all-transparent textures and forcealpha flag
        run: |
          python3 - <<'PY'
          import re
          # 1) interpreter.cpp: log textures whose decoded alpha is entirely zero
          p = 'libultraship/src/fast/interpreter.cpp'
          s = open(p).read()
          helper = '''#include <spdlog/fmt/fmt.h>
          #include <unordered_set>

          static void DiagCheckTexture(const char* fmtName, const uint8_t* rgba, uint32_t width, uint32_t height,
                                       const std::string& path, uint32_t sizeBytes, const uint8_t* src,
                                       const uint8_t* pal) {
          #ifdef __ANDROID__
              static std::unordered_set<std::string> seen;
              if (seen.size() >= 80) {
                  return;
              }
              size_t n = (size_t)width * (size_t)height;
              for (size_t i = 0; i < n; i++) {
                  if (rgba[4 * i + 3] != 0) {
                      return;
                  }
              }
              if (!seen.insert(path).second) {
                  return;
              }
              auto hex = [](const uint8_t* p, uint32_t len) {
                  std::string h;
                  if (p == nullptr) {
                      return std::string("null");
                  }
                  char b[4];
                  for (uint32_t k = 0; k < len; k++) {
                      snprintf(b, sizeof(b), "%02x", p[k]);
                      h += b;
                  }
                  return h;
              };
              SPDLOG_ERROR("[diag] all-transparent texture {} {}x{} bytes={} path={} data16={} pal16={}", fmtName, width,
                           height, sizeBytes, path, hex(src, sizeBytes < 16 ? sizeBytes : 16), hex(pal, 16));
          #endif
          }
          '''
          assert s.count('#include <spdlog/fmt/fmt.h>\n') == 1
          s = s.replace('#include <spdlog/fmt/fmt.h>\n', helper, 1)
          for fn, label, pal in [('Rgba16', 'RGBA16', 'nullptr'), ('Ci4', 'CI4', 'palette'), ('Ci8', 'CI8', 'mRdp->palettes[0]')]:
              pat = r'(void Interpreter::ImportTexture' + fn + r'\(int tile, bool importReplacement\) \{.*?)(    mRapi->UploadTexture\(mTexUploadBuffer, width, height\);)'
              new = (r'\1    DiagCheckTexture("' + label + '", mTexUploadBuffer, width, height, metadata->resource ? metadata->resource->GetInitData()->Path : std::string("<no resource>"), sizeBytes, addr, ' + pal + r');' + '\n' + r'\2')
              s, n = re.subn(pat, new, s, count=1, flags=re.S)
              assert n == 1, 'texture function not patched: ' + fn
          open(p, 'w').write(s)
          # 2) gfx_opengl.cpp: add a forcealpha flag next to the magenta one
          p = 'libultraship/src/fast/backends/gfx_opengl.cpp'
          s = open(p).read()
          anchor = '    if (DiagFlag("magenta")) {'
          assert s.count(anchor) == 1, 'run the previous graphics diagnostics step first'
          force = '''    if (DiagFlag("forcealpha")) {
              const std::string from = "discard;";
              const std::string to = "{ texel.a = 1.0; }";
              size_t pos = 0;
              while ((pos = result.find(from, pos)) != std::string::npos) {
                  result.replace(pos, from.size(), to);
                  pos += to.size();
              }
          }
          '''
          s = s.replace(anchor, force + anchor, 1)
          open(p, 'w').write(s)
          PY
          grep -n "DiagCheckTexture" libultraship/src/fast/interpreter.cpp
          grep -n "forcealpha" libultraship/src/fast/backends/gfx_opengl.cpp

      - name: Diagnostics v3 - reliable log file and alpha source view
        run: |
          python3 - <<'PY'
          import re
          log_helper = '''
          #include <sys/stat.h>
          static void DiagFileLog(const std::string& s) {
          #ifdef __ANDROID__
              mkdir("/storage/emulated/0/SOH/logs", 0777);
              FILE* f = fopen("/storage/emulated/0/SOH/logs/gfx-diag.txt", "a");
              if (f) {
                  fputs(s.c_str(), f);
                  fputc('\\n', f);
                  fclose(f);
              }
          #endif
          }
          #define DIAG_LOG(...) DiagFileLog(fmt::format(__VA_ARGS__))
          '''
          # --- gfx_opengl.cpp ---
          p = 'libultraship/src/fast/backends/gfx_opengl.cpp'
          s = open(p).read()
          assert s.count('static bool DiagFlag(const char* name) {') == 1, 'run the previous diagnostics steps first'
          s = s.replace('static bool DiagFlag(const char* name) {', '#include <cstdio>\n#include <spdlog/fmt/fmt.h>\n' + log_helper + '\nstatic bool DiagFlag(const char* name) {', 1)
          s = s.replace('SPDLOG_ERROR("[diag]', 'DIAG_LOG("[diag]')
          def block(flag, chans):
              lines = ['    if (DiagFlag("%s")) {' % flag,
                       '        std::string dbg = "vec4 dbg = vec4(0.5, 0.5, 0.5, 1.0);";']
              for ch, decl, expr in chans:
                  lines.append('        if (result.find("%s") != std::string::npos) dbg += " dbg.%s = %s;";' % (decl, ch, expr))
              lines += ['        const std::string from = "discard;";',
                        '        const std::string to = "{ " + dbg + " vOutColor = dbg; return; }";',
                        '        size_t pos = 0;',
                        '        while ((pos = result.find(from, pos)) != std::string::npos) {',
                        '            result.replace(pos, from.size(), to);',
                        '            pos += to.size();',
                        '        }',
                        '    }', '']
              return '\n'.join(lines)
          blocks = block('alphasrc', [('r', 'vec4 vInput1;', 'vInput1.a'), ('g', 'vec4 vInput2;', 'vInput2.a'), ('b', 'vec4 texVal0 =', 'texVal0.a')])
          blocks += block('alphasrc2', [('r', 'vec4 vInput3;', 'vInput3.a'), ('g', 'vec4 vInput4;', 'vInput4.a'), ('b', 'vec4 texVal1 =', 'texVal1.a')])
          anchor = '    if (DiagFlag("forcealpha")) {'
          assert s.count(anchor) == 1, 'forcealpha step missing'
          s = s.replace(anchor, blocks + anchor, 1)
          open(p, 'w').write(s)
          # --- interpreter.cpp ---
          p = 'libultraship/src/fast/interpreter.cpp'
          s = open(p).read()
          assert s.count('static void DiagCheckTexture(') == 1, 'texture diagnostics step missing'
          s = s.replace('static void DiagCheckTexture(', '#include <cstdio>\n' + log_helper + '\nstatic void DiagCheckTexture(', 1)
          s = s.replace('SPDLOG_ERROR("[diag]', 'DIAG_LOG("[diag]')
          open(p, 'w').write(s)
          PY
          grep -n "DIAG_LOG\|SPDLOG_ERROR(\"\[diag" libultraship/src/fast/backends/gfx_opengl.cpp libultraship/src/fast/interpreter.cpp

      - name: Diagnostics v4 - log combiner state of alpha-tested draws
        run: |
          python3 - <<'PY'
          import re
          p = 'libultraship/src/fast/interpreter.cpp'
          s = open(p).read()
          assert s.count('static void DiagCheckTexture(') == 1 and s.count('#define DIAG_LOG(') == 1, 'run diagnostics v3 first'
          helper = '''#include <set>
          #include <tuple>
          static void DiagAlphaDraw(uint64_t comb, uint32_t geom, uint32_t oml, uint32_t omh, bool fog, bool noise, bool thr,
                                    bool edge, int nin, const uint8_t* map0, const uint8_t* map1, int a0, int a1, int a2,
                                    int pr, int pg, int pb, int pa, int er, int eg, int eb, int ea, int fogmul,
                                    int fogoff, float z0, float w0) {
          #ifdef __ANDROID__
              static std::set<std::tuple<uint64_t, uint32_t, uint32_t>> seen;
              if (seen.size() >= 60 || !seen.insert(std::make_tuple(comb, geom, oml)).second) {
                  return;
              }
              DIAG_LOG("[diag] alpha-draw comb=0x{:x} geom=0x{:x} oml=0x{:x} omh=0x{:x} fog={} noise={} thr={} edge={} nin={} "
                       "map0={},{},{},{} map1={},{},{},{} vtxA={},{},{} prim={},{},{},{} env={},{},{},{} fogmul={} fogoff={} "
                       "z0={:.3f} w0={:.3f}",
                       comb, geom, oml, omh, fog, noise, thr, edge, nin, (int)map0[0], (int)map0[1], (int)map0[2], (int)map0[3],
                       (int)map1[0], (int)map1[1], (int)map1[2], (int)map1[3], a0, a1, a2, pr, pg, pb, pa, er, eg, eb, ea,
                       fogmul, fogoff, z0, w0);
          #endif
          }

          '''
          s = s.replace('static void DiagCheckTexture(', helper + 'static void DiagCheckTexture(', 1)
          pat = r'(mRapi->ShaderGetInfo\(prg, &numInputs, usedTextures\);)(\s*struct GfxClipParameters clip_parameters = mRapi->GetClipParameters\(\);\s*for \(int i = 0; i < 3; i\+\+\) \{\s*float z = v_arr\[i\]->z, w = v_arr\[i\]->w;)'
          call = r'''\1
              if (use_alpha && (texture_edge || alpha_threshold)) {
                  DiagAlphaDraw(mRdp->combine_mode, mRsp->geometry_mode, mRdp->other_mode_l, mRdp->other_mode_h, use_fog,
                                use_noise, alpha_threshold, texture_edge, (int)numInputs, comb->shader_input_mapping[0],
                                comb->shader_input_mapping[1], (int)v_arr[0]->color.a, (int)v_arr[1]->color.a,
                                (int)v_arr[2]->color.a, (int)mRdp->prim_color.r, (int)mRdp->prim_color.g,
                                (int)mRdp->prim_color.b, (int)mRdp->prim_color.a, (int)mRdp->env_color.r,
                                (int)mRdp->env_color.g, (int)mRdp->env_color.b, (int)mRdp->env_color.a, (int)mRsp->fog_mul,
                                (int)mRsp->fog_offset, v_arr[0]->z, v_arr[0]->w);
              }\2'''
          s, n = re.subn(pat, call, s, count=1)
          assert n == 1, 'draw anchor not found'
          open(p, 'w').write(s)
          PY
          grep -n "DiagAlphaDraw" libultraship/src/fast/interpreter.cpp

      - name: Diagnostics v5 - edge alpha test workarounds and final alpha view
        run: |
          python3 - <<'PY'
          p = 'libultraship/src/fast/backends/gfx_opengl.cpp'
          s = open(p).read()
          anchor = '    if (DiagFlag("alphasrc")) {'
          assert s.count(anchor) == 1, 'run diagnostics v3 first'
          new = '''    {
              const std::string kEdge = "if (texel.a > 0.19) texel.a = 1.0; else discard;";
              size_t epos = result.find(kEdge);
              if (DiagFlag("edgefix")) {
                  if (epos != std::string::npos) {
                      result.replace(epos, kEdge.size(), "if (!(texel.a > 0.19)) discard; texel.a = 1.0;");
                  } else {
                      DIAG_LOG("[diag] edgefix: pattern not found");
                  }
              } else if (DiagFlag("edgefix2")) {
                  if (epos != std::string::npos) {
                      result.replace(epos, kEdge.size(), "texel.a = (texel.a > 0.19) ? 1.0 : 0.0; if (texel.a < 0.5) discard;");
                  } else {
                      DIAG_LOG("[diag] edgefix2: pattern not found");
                  }
              }
          }
              if (DiagFlag("texela")) {
                  std::string dbg = "vec4 dbg = vec4(texel.a, 0.5, 0.5, 1.0);";
                  if (result.find("vec4 texVal0 =") != std::string::npos) dbg += " dbg.g = texVal0.a;";
                  if (result.find("vec4 vFog;") != std::string::npos) dbg += " dbg.b = vFog.a;";
                  const std::string from = "discard;";
                  const std::string to = "{ " + dbg + " vOutColor = dbg; return; }";
                  size_t pos = 0;
                  while ((pos = result.find(from, pos)) != std::string::npos) {
                      result.replace(pos, from.size(), to);
                      pos += to.size();
                  }
              }
          '''
          s = s.replace(anchor, new + anchor, 1)
          open(p, 'w').write(s)
          PY
          grep -n 'DiagFlag("edgefix\|DiagFlag("texela' libultraship/src/fast/backends/gfx_opengl.cpp

      - name: Apply patches (if any)
        run: |
          shopt -s nullglob
          for p in patches/main/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done
          for sub in libultraship ZAPDTR OTRExporter; do
            for p in patches/$sub/*.patch; do
              echo "Applying $p to $sub"
              (cd "$sub" && git apply --verbose "../$p")
            done
          done

      - name: Restore signing key from cache
        uses: actions/cache@v4
        with:
          path: Android/app/release.jks
          key: armv7-signing-key-v1

      - name: Create signing key if missing
        run: |
          if [ ! -f Android/app/release.jks ]; then
            keytool -genkeypair -keystore Android/app/release.jks -storetype PKCS12 \
              -storepass sohandroid -keypass sohandroid -alias soh \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SOH personal build"
          fi

      - name: Build release APK
        env:
          GIT_TAG: armv7-run${{ github.run_number }}
        run: |
          cd Android
          ./gradlew --no-daemon assembleRelease \
            -PstoreFile=release.jks -PstorePassword=sohandroid \
            -PkeyAlias=soh -PkeyPassword=sohandroid 2>&1 | tee ../build.log

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-armv7-${{ github.run_id }}

      - name: Summarize errors
        if: failure()
        run: |
          echo "===== FAILED targets ====="
          grep -n "FAILED:" build.log | cut -c1-300 | head -20 || true
          echo "===== First errors ====="
          grep -n -m 30 -E "error:|fatal error|undefined reference" build.log | cut -c1-400 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soh-armv7-apk
          path: Android/app/build/outputs/apk/release/*.apk
