name: Beta release (armv7, 32-bit)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Allow git in container
        run: git config --global --add safe.directory '*'

      - name: Compute build name
        id: name
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="dev-$RUN_NUMBER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Build name: $TAG"

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > Android/local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> Android/local.properties

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y ccache $(cat .github/workflows/apt-deps.txt)

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-armv7-beta-${{ github.run_id }}
          restore-keys: ccache-armv7-

      - name: Generate soh.o2r
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target GenerateSohOtr --parallel
          cp soh/soh.o2r Android/app/src/main/assets/soh.o2r

      - name: Apply patches
        run: |
          shopt -s nullglob
          for p in patches/main/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done
          for sub in libultraship ZAPDTR OTRExporter; do
            for p in patches/$sub/*.patch; do
              echo "Applying $p to $sub"
              (cd "$sub" && git apply --verbose "../$p")
            done
          done
          grep -q "abiFilters 'armeabi-v7a'" Android/app/build.gradle

      - name: Enable compiler cache in the native build
        run: |
          sed -i 's/"-DBUILD_REMOTE_CONTROL=1"/"-DBUILD_REMOTE_CONTROL=1", "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"/g' Android/app/build.gradle

      - name: Build signed release APK
        env:
          GIT_TAG: ${{ steps.name.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > Android/app/release.jks
          else
            if [ "$EVENT_NAME" = "release" ]; then
              echo "::error::Signing secrets are missing. Add them in Settings > Secrets and variables > Actions."
              exit 1
            fi
            echo "::warning::No signing secrets found: using a temporary key (not suitable for public releases)."
            KEY_ALIAS=temp
            STORE_PASS=temporary-pass
            KEY_PASS=temporary-pass
            keytool -genkeypair -keystore Android/app/release.jks -storetype PKCS12 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SOH temporary build"
          fi
          cd Android
          ./gradlew --no-daemon assembleRelease \
            -PstoreFile=release.jks "-PstorePassword=$STORE_PASS" \
            "-PkeyAlias=$KEY_ALIAS" "-PkeyPassword=$KEY_PASS" 2>&1 | tee ../build.log

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-armv7-beta-${{ github.run_id }}

      - name: Summarize errors
        if: failure()
        run: |
          echo "===== FAILED targets ====="
          grep -n "FAILED:" build.log | cut -c1-300 | head -20 || true
          echo "===== First errors ====="
          grep -n -m 30 -E "error:|fatal error|undefined reference" build.log | cut -c1-400 || true

      - name: Rename APK and write checksum
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          mkdir dist
          cp Android/app/build/outputs/apk/release/soh_release_*.apk "dist/Shipwright-armv7-${TAG}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "dist/Shipwright-armv7-${TAG}.apk" | grep -i "SHA-256" || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: armv7-apk
          path: dist/*

      - name: Upload native symbols (for crash analysis)
        uses: actions/upload-artifact@v4
        with:
          name: native-symbols
          path: Android/app/.cxx/RelWithDebInfo/*/armeabi-v7a/libsoh.so
          if-no-files-found: ignore
          retention-days: 30

      - name: Attach APK to the GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          prerelease: ${{ github.event.release.prerelease }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
